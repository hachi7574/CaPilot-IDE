name: Release

# Tag-triggered release pipeline:
# builds + signs the Linux/Windows bundles, uploads them to the GitHub
# release for the tag, then assembles the updater `latest.json` manifest from
# the build-time `.sig` files and uploads that too.
# macOS is intentionally unsupported (no Apple Developer ID / notarization).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Cargo.toml is the single source of truth; fail the release early if the tag
  # doesn't match every version source (see .github/scripts/bump-version.mjs).
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/bump-version.mjs --check "${{ github.ref_name }}"

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm must be on PATH before setup-node so `cache: pnpm` can resolve
      # the store dir; the node/pnpm caches restore `pnpm install` to seconds.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Warm cargo cache shared across runs (keyed on Cargo.lock + rustc).
      # Without this every tag run recompiles the whole Tauri dependency tree
      # in release mode on both platforms — the long pole (~7min/job).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Azure Ubuntu mirrors occasionally stall `apt-get update` with no
      # progress until the job's 6h default timeout. Cap the step and retry
      # with short Acquire timeouts so a hung mirror fails in minutes, not hours.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::ftp::Timeout=20
          )
          for i in 1 2 3; do
            if sudo apt-get "${apt_opts[@]}" update; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts"
              exit 1
            fi
            echo "apt-get update failed (attempt $i), retrying..."
            sleep 5
          done
          sudo apt-get "${apt_opts[@]}" install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install

      # `pnpm tauri build` runs `beforeBuildCommand: pnpm build` (tsc + vite).
      # With `createUpdaterArtifacts: true` and the signing key present, the
      # bundler emits the `.sig` files the updater verifies against.
      - name: Build and sign bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # Tauri's bundler only signs the AppImage as an updater artifact on Linux.
      # Sign the .deb too so deb-installed users can update in-place (the updater
      # matches `{os}-{arch}-{installer}` first, so a deb install fetches the deb).
      - name: Sign .deb updater artifact
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            echo "signing $deb"
            pnpm tauri signer sign "$deb"
          done

      # Platform-scoped globs: a single files: block listing every target makes
      # Windows warn about missing appimage/deb (and Linux about nsis). Only upload
      # what this runner actually produced. Retries absorb intermittent GitHub
      # Releases 503s that otherwise fail a green build at the last step.
      - name: Upload Linux bundles to the release
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CaPilot ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows bundles to the release
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CaPilot ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after every platform upload finished. Reads each platform's `.sig`
  # content (produced at build time) and writes the static latest.json the app
  # polls. The raw `latest.json` is NOT signed itself — signatures live inside it.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Assemble latest.json
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/make-manifest.mjs

      - name: Upload latest.json
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: latest.json
