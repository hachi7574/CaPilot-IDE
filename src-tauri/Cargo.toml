[package]
name = "capilot-ide"
version = "0.1.9"
description = "CaPilot IDE — local AI coding workspace"
authors = ["hachi7574"]
edition = "2021"
default-run = "capilot-ide"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "capilot_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Windows AF_UNIX for the daemon socket. std::os::windows::net is unstable on
# stable Rust (E0658 `windows_unix_domain_sockets`); uds_windows mirrors the
# std UnixListener/UnixStream API. See daemon/server.rs and daemon/client.rs.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"

[dependencies]
# `protocol-asset` powers convertFileSrc (image viewer loads local files via the
# asset:// protocol; see app.security.assetProtocol in tauri.conf.json).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File-content search (fs_search): line matching in the pure-Rust walker engine
# plus glob support for include/exclude filters. `regex` is already in the tree;
# globset pulls a few small pure-Rust crates.
regex = "1"
globset = "0.4"
# Rate-limit usage fetch (opencode.ai workspace page). reqwest 0.13 is already
# in the dependency tree (via tauri-plugin-updater) with `rustls-no-provider`
# TLS enabled, so this adds no new compiled crates. rustls (ring provider) is
# also already in the tree via the updater; usage.rs installs the process-global
# crypto provider so the reqwest Client can be built before the updater runs.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-updater = "2.10.1"
url = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-process = "2.3.1"
portable-pty = "0.9.0"
# VT parser backing the daemon's attach checkpoint.
# Pure Rust, Tauri-independent — the daemon feeds every PTY chunk through a
# `vt100::Parser` and serializes the active screen (main/alt + styles + cursor)
# into a replayable byte stream on Attach. Version pinned to what the lockfile
# already resolved.
vt100 = "0.16.2"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "rt", "macros", "rt-multi-thread", "time", "net"] }
uuid = { version = "1.24.0", features = ["v4"] }
thiserror = "2.0.19"
async-trait = "0.1.91"
log = "0.4.33"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sysinfo = "0.39.6"
# Signal handling for the resident daemon (SIGHUP ignore, §9.4).
libc = "0.2"
# Cross-process advisory file locking for `.agent-meta.json` (flock on Unix,
# LockFileEx on Windows) — the GUI process and the PTY daemon must serialize
# read-modify-write on the same sidecar without a shared mutex.
fs2 = "0.4"
ruzstd = "0.9.0"
